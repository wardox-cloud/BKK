# Builds the Android keyboard, runs its tests, and publishes the APK as a
# GitHub release so it can be downloaded straight to the phone.
name: Android keyboard

on:
  push:
    paths:
      - "android/**"
      - "shared/prompts.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ../murmur-keyboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: murmur-keyboard
          path: murmur-keyboard.apk
      - name: Publish download
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-${{ github.run_number }}
          name: Murmur keyboard, build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: murmur-keyboard.apk
          body: |
            Open this page on your Android phone and tap **murmur-keyboard.apk** to install.
            Setup steps are in the README under "Android keyboard".
