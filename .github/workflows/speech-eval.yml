# Runs real accented and mixed-language recordings through the transcription
# options. API keys are optional repository secrets; without them only the
# local Whisper model (the same one Groq serves) is tested.
name: Speech eval

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover (list datasets) or run (full test)"
        default: run
      clips:
        description: "Clips per source"
        default: "8"
      extra:
        description: "Extra flags, e.g. --primer-experiment"
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - run: pip install -r eval/requirements.txt
      - name: Discover datasets
        if: inputs.mode == 'discover'
        run: python eval/discover.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Run speech test
        if: inputs.mode == 'run'
        run: python eval/speech_eval.py --clips ${{ inputs.clips }} ${{ inputs.extra }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'run' && always()
        with:
          name: speech-eval-results
          path: eval-results/
          if-no-files-found: ignore
